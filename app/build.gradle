plugins {
    id 'com.android.application'
}

android {
    namespace 'com.citydiner.billing'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('citydiner.keystore')
            storePassword 'citydiner123'
            keyAlias 'citydiner'
            keyPassword 'citydiner123'
        }
    }

    defaultConfig {
        applicationId 'com.citydiner.billing'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '2.8'
    }

    flavorDimensions 'role'
    productFlavors {
        owner {
            dimension 'role'
            applicationId 'com.citydiner.billing'
            manifestPlaceholders = [appLabel: 'City Diner']
        }
        waiter {
            dimension 'role'
            applicationId 'com.citydiner.waiter'
            manifestPlaceholders = [appLabel: 'CityDiner Waiter']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.print:print:1.0.0'
}
