<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Diner Billing</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c2a23">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#eff3f1;--card:#fff;--ink:#10241f;--mut:#62776f;--line:#dbe3df;--pri:#0f3d33;--pri-ink:#fff;--gold:#a87a1f;--red:#c0392b;--ok:#1f8a5b;--chip:#e4ebe7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1512;--card:#12251f;--ink:#eaf1ee;--mut:#8fa69e;--line:#24403a;--pri:#d4a843;--pri-ink:#1a1405;--gold:#d4a843;--red:#ef6a56;--ok:#43c68b;--chip:#1b332c}}
:root[data-theme="dark"]{--bg:#0a1512;--card:#12251f;--ink:#eaf1ee;--mut:#8fa69e;--line:#24403a;--pri:#d4a843;--pri-ink:#1a1405;--gold:#d4a843;--red:#ef6a56;--ok:#43c68b;--chip:#1b332c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0}
header{background:#0c2a23;color:#f3e9cf;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:2px solid #c9a24a}
header h1{font-size:20px;letter-spacing:1.5px;color:#e3c274}header small{display:block;font:500 11px Inter;color:#9fb8b0;letter-spacing:.5px}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;order:3;width:100%}.lg{width:46px;height:46px;border-radius:50%;flex:none}.sy{order:2;margin-left:auto;font:600 11px Inter;color:#9fb8b0}@media(min-width:861px){nav{order:1;width:auto}}
nav button{background:none;border:0;color:#cfe0da;padding:8px 14px;border-radius:8px;font:600 13px Inter;cursor:pointer;white-space:nowrap}
nav button.on{background:#c9a24a;color:#1a1405}
main{max-width:1200px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}.grid>*{min-width:0}@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.sticky{position:sticky;top:10px}@media(max-width:860px){.sticky{position:static}}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:none}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:8px;padding:10px 14px;font:600 14px Inter;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:thin}
.chip{flex:none;background:var(--chip);color:var(--ink);border:0;border-radius:99px;padding:6px 12px;font:500 13px Inter;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-ink)}
#list{max-height:68vh;overflow:auto}
.ch{font:700 13px Cinzel,serif;color:var(--gold);padding:12px 2px 4px;border-bottom:1px solid var(--line);letter-spacing:.5px}
.li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.li .nm{flex:1;min-width:0;overflow-wrap:anywhere}.dot{width:12px;height:12px;border:1.5px solid;border-radius:3px;display:inline-grid;place-items:center;flex:none}
.dot::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.dot.v{color:#1f8a5b}.dot.n{color:#c0392b}
.pb{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font:600 13px Inter;cursor:pointer;min-width:66px}
.pb:hover{border-color:var(--gold);background:var(--chip)}.pb small{display:block;color:var(--mut);font:500 10px Inter}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}.wrap{overflow-x:auto}
.tot{display:flex;justify-content:space-between;padding:3px 0}.tot.big{font:700 20px Cinzel,serif;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat b{display:block;font:700 22px Cinzel,serif}.stat span{color:var(--mut);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.tag.due{color:var(--red);border-color:var(--red)}.tag.paid{color:var(--ok);border-color:var(--ok)}
.mut{color:var(--mut)}.empty{padding:22px;text-align:center;color:var(--mut)}
.cl{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px;width:92%;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0c2a23;color:#f3e9cf;padding:9px 16px;border-radius:8px;display:none;z-index:9}
#bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);gap:12px;align-items:center}
.x{display:none}
@media(max-width:860px){
.bt #bar{display:flex}.x{display:inline-block}
main{padding:10px 10px 90px}.card{padding:12px}
input,select{font-size:16px}
#list{max-height:none;overflow:visible}
.chips{position:sticky;top:0;z-index:2;background:var(--card);margin:0 -12px;padding:8px 12px}
.btn.sm{padding:8px 13px}
#bcard{display:none}
#bcard.open{display:block;position:fixed;inset:0;z-index:30;overflow:auto;border-radius:0;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media print{header,main,#bar,#toast,.noprint{display:none!important}body{background:#fff;color:#000}dialog{border:0;position:static;max-width:none;width:100%;max-height:none}}

function rep(){
const td=new Date().toDateString(),T=S.invoices.filter(v=>new Date(v.date).toDateString()===td);const sum=(a,f)=>a.reduce((s,v)=>s+f(v),0);
const pm={};S.invoices.forEach(v=>{const k=v.paid?v.mode:'Due';pm[k]=(pm[k]||0)+v.total});
const top={};S.invoices.forEach(v=>v.lines.forEach(l=>{const k=l.name+(l.size?' ('+l.size+')':'');top[k]=(top[k]||0)+l.qty}));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8);
$('#app').innerHTML=`<div class="stats"><div class="card stat"><b>${inr(sum(T,v=>v.total))}</b><span>Today's sales (${T.length} bills)</span></div><div class="card stat"><b>${inr(sum(S.invoices,v=>v.total))}</b><span>All-time sales</span></div><div class="card stat"><b>${S.invoices.length}</b><span>Total bills</span></div><div class="card stat"><b>${inr(sum(S.invoices.filter(v=>!v.paid),v=>v.total))}</b><span>Payments due</span></div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><h3>Payment split</h3>${Object.keys(pm).length?Object.entries(pm).map(([k,v])=>`<div class="tot"><span>${k}</span><span>${inr(v)}</span></div>`).join(''):'<div class="empty">No sales yet.</div>'}</div><div class="card"><h3>Top sellers</h3>${tp.length?tp.map(([k,v])=>`<div class="tot"><span>${esc(k)}</span><span>${v} sold</span></div>`).join(''):'<div class="empty">No sales yet.</div>'}</div></div>`}
$('#hl').src=LOGO;render();initCloud();
if(!window.AndroidBridge&&'serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
